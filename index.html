<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIKA SHARO - 4K Anime Wallpapers</title>
  <meta name="description" content="NIKA SHARO - Search and download high resolution anime wallpapers.">
  <meta name="theme-color" content="#080808">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="logo">NIKA <span>SHARO</span></div>

  <nav>
    <button onclick="showHome()">Home</button>
    <button onclick="showRecent()">Recent</button>
    <button onclick="showCategories()">Categories</button>
  </nav>
</header>

<section class="hero">

  <div class="hero-content">
    <p class="small-title">WELCOME TO</p>

    <h1>NIKA <span>SHARO</span></h1>

    <p class="subtitle">
      Discover high-resolution anime wallpapers
    </p>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="Search anime... Naruto, Gojo, Luffy..."
        autocomplete="off"
      >

      <button onclick="searchWallpapers()">🔍 Search</button>
    </div>

    <div class="quick-search">
      <button onclick="quickSearch('Naruto')">Naruto</button>
      <button onclick="quickSearch('One Piece')">One Piece</button>
      <button onclick="quickSearch('Jujutsu Kaisen')">Jujutsu Kaisen</button>
      <button onclick="quickSearch('Demon Slayer')">Demon Slayer</button>
      <button onclick="quickSearch('Solo Leveling')">Solo Leveling</button>
    </div>
  </div>

</section>

<main>

  <div class="section-head">
    <div>
      <p class="section-label">EXPLORE</p>
      <h2 id="sectionTitle">Latest Wallpapers</h2>
    </div>

    <button class="refresh-btn" onclick="loadLatest()">
      ↻ Refresh
    </button>
  </div>

  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading wallpapers...</p>
  </div>

  <div id="wallpaperGrid" class="wallpaper-grid"></div>

  <div id="empty" class="empty hidden">
    <h3>No wallpapers found</h3>
    <p>Try another anime name.</p>
  </div>

</main>

<!-- Preview Modal -->

<div id="modal" class="modal">

  <div class="modal-content">

    <button class="close" onclick="closeModal()">×</button>

    <img id="modalImage" src="" alt="Anime Wallpaper">

    <div class="modal-info">
      <div>
        <h2 id="modalTitle">Wallpaper</h2>
        <p id="modalResolution"></p>
      </div>

      <a
        id="downloadBtn"
        class="download-btn"
        href="#"
        target="_blank"
        rel="noopener"
      >
        ⬇ Download
      </a>
    </div>

  </div>

</div>

<footer>
  <div class="logo">NIKA <span>SHARO</span></div>
  <p>Anime wallpapers • High resolution • Made for fans</p>
</footer>

<script src="script.js"></script>

</body>
</html>
